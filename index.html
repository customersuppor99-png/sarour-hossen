<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দৈনিক প্রতিচ্ছবি | পূর্ণ গঠন উৎসব কার্ড</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #050505; color: white; }
        .gradient-btn { background: linear-gradient(90deg, #b91c1c, #dc2626, #991b1b); }
        .canvas-container { box-shadow: 0 0 50px rgba(220, 38, 38, 0.3); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Input Panel -->
    <div class="bg-zinc-900/80 backdrop-blur-md border border-zinc-800 p-8 rounded-[2rem] w-full max-w-lg mb-12">
        <h1 class="text-3xl font-black text-center text-red-500 mb-6 uppercase italic">Dainik Protichhobi Pro</h1>
        
        <div class="space-y-5">
            <input type="text" id="userName" placeholder="সদস্যের নাম" class="w-full bg-zinc-800 border-none p-4 rounded-xl focus:ring-2 focus:ring-red-600 outline-none text-white">
            
            <div class="flex flex-col gap-2">
                <label class="text-xs text-zinc-500 font-bold ml-2">প্রোফাইল পিকচার আপলোড</label>
                <input type="file" id="imageUpload" accept="image/*" class="w-full text-sm text-zinc-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-zinc-700 file:text-white cursor-pointer">
            </div>

            <button onclick="generateCard()" class="w-full gradient-btn py-4 rounded-xl font-bold text-xl uppercase tracking-widest hover:scale-[1.02] transition-transform shadow-lg">
                ম্যাজিক কার্ড তৈরি করুন ✨
            </button>
        </div>
    </div>

    <!-- Output Section -->
    <div id="output-area" class="hidden flex flex-col items-center w-full">
        <div class="canvas-container rounded-[2.5rem] overflow-hidden border-[6px] border-zinc-800">
            <canvas id="photoCard" width="1080" height="1350" class="max-w-full h-auto w-[450px]"></canvas>
        </div>
        
        <button onclick="downloadImage()" class="mt-10 bg-green-600 hover:bg-green-700 text-white px-12 py-5 rounded-full font-black text-xl shadow-2xl flex items-center gap-4 active:scale-95 transition-all">
            📥 এইচডি ফটো ডাউনলোড করুন
        </button>
    </div>

    <script>
        const canvas = document.getElementById('photoCard');
        const ctx = canvas.getContext('2d');
        const logo = new Image();
        logo.src = '1000067122.jpg'; // আপনার লোগো

        function generateCard() {
            const name = document.getElementById('userName').value.trim() || "সম্মানিত সদস্য";
            const fileInput = document.getElementById('imageUpload');

            if (fileInput.files.length === 0) {
                alert("একটি ছবি বেছে নিন!");
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    draw(img, name);
                    document.getElementById('output-area').classList.remove('hidden');
                    window.scrollTo({top: canvas.offsetTop, behavior: 'smooth'});
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function draw(img, name) {
            // ১. ক্যানভাস সাইজ (Portrait 4:5 ratio for Social Media)
            const w = canvas.width;
            const h = canvas.height;

            // ২. ফটো ক্রপিং এবং ড্রয়িং
            const scale = Math.max(w / img.width, h / img.height);
            const x = (w / 2) - (img.width / 2) * scale;
            const y = (h / 2) - (img.height / 2) * scale;
            ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

            // ৩. ভাইনাল গ্রাডিয়েন্ট ওভারলে
            const grad = ctx.createLinearGradient(0, h * 0.4, 0, h);
            grad.addColorStop(0, 'rgba(0,0,0,0)');
            grad.addColorStop(0.5, 'rgba(10, 10, 50, 0.85)'); // Indigo
            grad.addColorStop(1, 'rgba(150, 0, 0, 1)');      // Red
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // ৪. কার্ভ ডিজাইন (Bottom Wave)
            ctx.fillStyle = 'rgba(20, 0, 0, 0.9)';
            ctx.beginPath();
            ctx.moveTo(0, h * 0.65);
            ctx.bezierCurveTo(w * 0.3, h * 0.55, w * 0.7, h * 0.55, w, h * 0.65);
            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.fill();

            // ৫. ফেস্টিভ ডেকোরেশন (উৎসবের আমেজ)
            // কর্নারে ডিজাইন
            ctx.fillStyle = "#FFD700"; // Golden
            for(let i=0; i<8; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 150, 0);
                ctx.lineTo(i * 150 + 75, 100);
                ctx.lineTo(i * 150 + 150, 0);
                ctx.fill();
            }

            // ৬. টেক্সট এবং ব্র্যান্ডিং
            ctx.textAlign = "center";
            ctx.fillStyle = "white";

            // পোর্টালে নাম
            ctx.font = "bold 90px 'Hind Siliguri'";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "black";
            ctx.fillText("দৈনিক প্রতিচ্ছবি", w/2, h * 0.75);

            // মেইন শুভেচ্ছা বার্তা
            ctx.fillStyle = "#FFD700";
            ctx.font = "bold 45px 'Hind Siliguri'";
            ctx.fillText("পূর্ণ গঠনের জন্য শুভকামনা", w/2, h * 0.81);

            // মেম্বার নাম বক্স
            ctx.fillStyle = "white";
            ctx.font = "bold 70px 'Hind Siliguri'";
            ctx.fillText(name, w/2, h * 0.92);

            // ওয়েবসাইট
            ctx.font = "30px Arial";
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.fillText("www.dainikprotichhobi.com", w/2, h * 0.97);

            // লোগো বসানো (উপরে ডানে)
            try {
                ctx.drawImage(logo, w - 350, 50, 300, 130);
            } catch(e) {}
            
            // বামে স্পেশাল ব্যাজ
            ctx.beginPath();
            ctx.arc(150, 150, 80, 0, Math.PI * 2);
            ctx.fillStyle = "#dc2626";
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.lineWidth = 5;
            ctx.stroke();
            ctx.fillStyle = "white";
            ctx.font = "bold 30px 'Hind Siliguri'";
            ctx.fillText("নতুন", 150, 145);
            ctx.fillText("যাত্রা", 150, 180);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'Dainik_Protichhobi_Utsab.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
