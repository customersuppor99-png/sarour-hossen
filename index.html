<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>দৈনিক প্রতিচ্ছবি - অটো ফটো কার্ড</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #canvas-container { display: none; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center p-5">

    <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold text-center text-red-600 mb-4">Photo Card Generator</h2>
        
        <label class="block mb-2 font-semibold">আপনার নাম লিখুন:</label>
        <input type="text" id="userName" placeholder="নাম লিখুন" class="w-full p-2 border rounded mb-4">

        <label class="block mb-2 font-semibold">ছবি আপলোড করুন:</label>
        <input type="file" id="imageUpload" accept="image/*" class="w-full p-2 border rounded mb-4">

        <button onclick="generateCard()" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">কার্ড তৈরি করুন</button>
        
        <div id="output-area" class="mt-6 flex flex-col items-center">
            <canvas id="photoCard" width="800" height="1000" class="border shadow-md max-w-full h-auto"></canvas>
            <button id="downloadBtn" style="display:none;" onclick="downloadImage()" class="mt-4 bg-blue-600 text-white px-6 py-2 rounded">ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('photoCard');
        const ctx = canvas.getContext('2d');
        const logo = new Image();
        logo.src = '1000067122.jpg'; // আপনার দেওয়া লোগো ফাইল

        function generateCard() {
            const name = document.getElementById('userName').value || "আপনার নাম";
            const file = document.getElementById('imageUpload').files[0];
            const reader = new FileReader();

            if (!file) {
                alert("দয়া করে একটি ছবি সিলেক্ট করুন।");
                return;
            }

            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // ১. ব্যাকগ্রাউন্ড ডিজাইন
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // ২. লোগো/হেডার সেকশন (কালো ব্যাকগ্রাউন্ড লোগোর জন্য)
                    ctx.fillStyle = "#000000";
                    ctx.fillRect(0, 0, canvas.width, 200);
                    ctx.drawImage(logo, 50, 25, 700, 150);

                    // ৩. ইউজারের ছবি (মাঝখানে)
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(400, 500, 250, 0, Math.PI * 2, true);
                    ctx.closePath();
                    ctx.clip();
                    ctx.drawImage(img, 150, 250, 500, 500);
                    ctx.restore();

                    // ৪. বর্ডার এবং টেক্সট সেকশন
                    ctx.fillStyle = "#e11d48"; // নিউজ রেড কালার
                    ctx.fillRect(0, 800, canvas.width, 200);

                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 50px Arial";
                    ctx.textAlign = "center";
                    ctx.fillText(name, 400, 880);
                    
                    ctx.font = "30px Arial";
                    ctx.fillText("ভেরিফাইড মেম্বার - দৈনিক প্রতিচ্ছবি", 400, 940);

                    document.getElementById('downloadBtn').style.display = 'block';
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        function downloadImage() {
            const link = document.createElement('a');
            link.download = 'Dainik_Protichhobi_Card.png';
            link.href = canvas.toDataURL();
            link.click();
        }
    </script>
</body>
</html>
